name: Android CI and Release

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
  push:
    branches:
      - 'personal/main'
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: android-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Validate Android build
    if: github.event_name != 'push' || !startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install required Android SDK packages
        run: sdkmanager "platforms;android-37.0" "build-tools;36.0.0"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.5.0'

      - name: Generate secrets.properties
        env:
          API_GATEWAY: ${{ secrets.API_GATEWAY }}
          SIGN_SALT: ${{ secrets.SIGN_SALT }}
          API_CID: ${{ secrets.API_CID }}
        run: |
          printf 'API_GATEWAY=%s\n' "$API_GATEWAY" > secrets.properties
          printf 'SIGN_SALT=%s\n' "$SIGN_SALT" >> secrets.properties
          printf 'API_CID=%s\n' "$API_CID" >> secrets.properties

      - name: Run unit tests
        run: ./gradlew testDebugUnitTest --no-daemon --stacktrace --info

      - name: Run Android lint
        run: ./gradlew lintDebug --no-daemon --stacktrace

      - name: Build debug APK
        run: ./gradlew assembleDebug --no-daemon --stacktrace --info

      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: WaterWidget-test-reports
          path: |
            app/build/reports/tests/**
            app/build/test-results/**
          if-no-files-found: ignore

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: WaterWidget-debug-apk
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error

  release:
    name: Build and publish Android release
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install required Android SDK packages
        run: sdkmanager "platforms;android-37.0" "build-tools;36.0.0"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.5.0'

      - name: Verify release tag matches app version
        run: |
          version_name="$(sed -n 's/^[[:space:]]*versionName = "\(.*\)"/\1/p' app/build.gradle.kts | head -n 1)"
          test -n "$version_name"
          test "$GITHUB_REF_NAME" = "v$version_name"

      - name: Check release configuration
        id: release_config
        env:
          API_GATEWAY: ${{ secrets.API_GATEWAY }}
          SIGN_SALT: ${{ secrets.SIGN_SALT }}
          API_CID: ${{ secrets.API_CID }}
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          EXPECTED_RELEASE_CERT_SHA256: ${{ vars.EXPECTED_RELEASE_CERT_SHA256 }}
        run: |
          for name in API_GATEWAY SIGN_SALT API_CID ANDROID_KEYSTORE_BASE64 ANDROID_KEYSTORE_PASSWORD ANDROID_KEY_ALIAS ANDROID_KEY_PASSWORD; do
            if [[ -z "${!name}" ]]; then
              echo "::error::Missing required Actions secret: $name"
              exit 1
            fi
          done
          expected_cert_sha256="$(printf '%s' "$EXPECTED_RELEASE_CERT_SHA256" | tr -d '[:space:]:' | tr 'A-F' 'a-f')"
          if [[ ! "$expected_cert_sha256" =~ ^[0-9a-f]{64}$ ]]; then
            echo "::error::Set the Actions variable EXPECTED_RELEASE_CERT_SHA256 to your signing certificate SHA-256 fingerprint."
            exit 1
          fi
          printf 'cert_sha256=%s\n' "$expected_cert_sha256" >> "$GITHUB_OUTPUT"

      - name: Generate secrets.properties
        env:
          API_GATEWAY: ${{ secrets.API_GATEWAY }}
          SIGN_SALT: ${{ secrets.SIGN_SALT }}
          API_CID: ${{ secrets.API_CID }}
        run: |
          printf 'API_GATEWAY=%s\n' "$API_GATEWAY" > secrets.properties
          printf 'SIGN_SALT=%s\n' "$SIGN_SALT" >> secrets.properties
          printf 'API_CID=%s\n' "$API_CID" >> secrets.properties

      - name: Run unit tests
        run: ./gradlew testDebugUnitTest --no-daemon --stacktrace --info

      - name: Run Android lint
        run: ./gradlew lintDebug --no-daemon --stacktrace

      - name: Build signed release APK
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          umask 077
          printf '%s' "$ANDROID_KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/waterwidget-release.jks"
          ANDROID_KEYSTORE_PATH="$RUNNER_TEMP/waterwidget-release.jks" ./gradlew assembleRelease --no-daemon --stacktrace --info

      - name: Verify release APK signature
        env:
          EXPECTED_RELEASE_CERT_SHA256: ${{ steps.release_config.outputs.cert_sha256 }}
        run: |
          apk_path="app/build/outputs/apk/release/app-release.apk"
          signer_output="$("$ANDROID_HOME/build-tools/36.0.0/apksigner" verify --verbose --print-certs "$apk_path")"
          printf '%s\n' "$signer_output"
          actual_cert_sha256="$(printf '%s\n' "$signer_output" | awk -F': ' '/Signer #1 certificate SHA-256 digest/ {print $2; exit}')"
          if [[ "$actual_cert_sha256" != "$EXPECTED_RELEASE_CERT_SHA256" ]]; then
            echo "::error::Release APK signing certificate does not match EXPECTED_RELEASE_CERT_SHA256."
            exit 1
          fi

      - name: Preserve R8 mapping
        uses: actions/upload-artifact@v4
        with:
          name: WaterWidget-${{ github.ref_name }}-r8-mapping
          path: app/build/outputs/mapping/release/mapping.txt
          if-no-files-found: error

      - name: Prepare release APK
        run: |
          apk_path="app/build/outputs/apk/release/app-release.apk"
          test -f "$apk_path"
          mkdir -p "$RUNNER_TEMP/release-assets"
          cp "$apk_path" "$RUNNER_TEMP/release-assets/WaterWidget-${GITHUB_REF_NAME}-release.apk"

      - name: Upload signed release APK
        uses: actions/upload-artifact@v4
        with:
          name: WaterWidget-${{ github.ref_name }}-release-apk
          path: ${{ runner.temp }}/release-assets/WaterWidget-${{ github.ref_name }}-release.apk
          if-no-files-found: error

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          asset="$RUNNER_TEMP/release-assets/WaterWidget-${GITHUB_REF_NAME}-release.apk"
          release_flags=()
          if [[ "$GITHUB_REF_NAME" == *-* ]]; then
            release_flags=(--prerelease --latest=false)
          fi
          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            gh release upload "$GITHUB_REF_NAME" "$asset" --clobber
            if (( ${#release_flags[@]} > 0 )); then
              gh release edit "$GITHUB_REF_NAME" "${release_flags[@]}"
            fi
          else
            gh release create "$GITHUB_REF_NAME" "$asset" --verify-tag --generate-notes "${release_flags[@]}"
          fi
